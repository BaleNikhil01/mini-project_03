apiVersion: networking.k8s.io/v1
kind: Ingress                              # Resource type — a rule that routes external HTTP traffic to a Service


metadata:
  name: level2-app-ingress

spec:
  rules:
    - http:
        paths:
          - path: /                             # Match root "/" and everything under it ("/foo", "/bar/baz", etc.)
            pathType: Prefix                    # Prefix (match / and all sub-paths), Exact (match only eg. /api only, no "/" no /api/admin )
            backend:
              service:
                name: level2-app-service       # The Kubernetes Service to route to
                port:
                  number: 80                    # port open on that service



